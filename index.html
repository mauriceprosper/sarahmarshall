            { id: 40, title: 'Content #40', file: 'videos/51a1d548-e119-4e93-a604-007f74571637.MP4', duration: '12 min' },
        ];

        const videosPerLoad = 20;
        let currentIndex = 0;

        // Render videos
        function renderVideos(startIndex, endIndex) {
            const grid = document.getElementById('videoGrid');
            const videoSlice = videos.slice(startIndex, endIndex);

            videoSlice.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-thumbnail">
                        <video width="100%" height="100%" style="object-fit: cover;">
                            <source src="${video.file}" type="video/mp4">
                        </video>
                        <div class="play-button"></div>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-meta">
                            <span>${video.duration}</span>
                        </div>
                    </div>
                `;
                
                // Add click to play functionality
                card.addEventListener('click', function() {
                    playVideo(video.file, video.title);
                });

                grid.appendChild(card);
            });
        }

        // Play video in modal
        function playVideo(videoFile, videoTitle) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close-btn">&times;</span>
                    <h2>${videoTitle}</h2>
                    <video width="100%" height="auto" controls autoplay>
                        <source src="${videoFile}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal || e.target.classList.contains('close-btn')) {
                    modal.remove();
                }
            });
        }

        // Load more functionality
        function loadMore() {
            const startIndex = currentIndex;
            const endIndex = currentIndex + videosPerLoad;
            renderVideos(startIndex, Math.min(endIndex, videos.length));
            currentIndex = endIndex;

            // Hide load more button if all videos are loaded
            if (currentIndex >= videos.length) {
                document.getElementById('loadMoreBtn').style.display = 'none';
            }
        }

        // Initialize
        function init() {
            loadMore();
            document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
        }

        // Run on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
